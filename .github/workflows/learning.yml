permissions:
  contents: write
name: Learning Agent
on:
  workflow_run:
    workflows: ["Debugger & Tester Agent", "Build & Export Agent"]
    types:
      - completed
jobs:
  learn_from_failures:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Learning Agent Prompt
        run: |
          echo "🧠 LEARNING AGENT"
          echo "Analyzing logs from recent test/build failures."
      - name: Generate Learning Agent Report (placeholder)
        run: |
          mkdir -p docs
          cat <<EOT > docs/learning_agent_report.md
          # M.A.T.R.I.X OS – Learning Agent Report

          ## Failure Detected
          - Most recent workflow: ${{ github.event.workflow_run.name }}
          - Failure time: ${{ github.event.workflow_run.updated_at }}
          - Log analysis: Placeholder summary of failure causes.

          ## Failure Patterns
          - Repeated error: missing function implementation in FileSystem.

          ## Improved Prompts
          - Recommend: Update Core OS Developer Agent prompt to verify all required functions exist.

          ## Suggested System Changes
          - Add a checklist to each agent's output.

          ---
          *This is a placeholder. Replace with real log analysis and suggestions as the agent matures.*
          EOT
      - name: Commit & Push Learning Agent Report
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/learning_agent_report.md
          git commit -m "Learning Agent: Automated post-failure analysis and recommendations" || echo "No changes to commit"
          git push || echo "Nothing to push"
